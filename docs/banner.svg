  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <!-- faint candles -->
  <g opacity="0.22">
    <g fill="#22c55e"><rect x="760" y="150" width="14" height="60"/><rect x="800" y="130" width="14" height="70"/><rect x="880" y="110" width="14" height="60"/><rect x="960" y="80" width="14" height="70"/><rect x="1040" y="60" width="14" height="60"/><rect x="1120" y="40" width="14" height="55"/></g>
    <g fill="#ef4444"><rect x="840" y="135" width="14" height="40"/><rect x="920" y="105" width="14" height="45"/><rect x="1000" y="85" width="14" height="40"/><rect x="1080" y="60" width="14" height="35"/></g>
  </g>
  <polyline points="740,230 790,205 830,212 880,170 930,178 980,135 1030,140 1080,98 1130,80 1170,55" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="740,250 800,238 860,222 920,205 980,188 1040,168 1100,150 1170,128" fill="none" stroke="#e879f9" stroke-width="3" stroke-dasharray="2 0" opacity="0.8"/>
  <!-- logo -->
  <g transform="translate(70,78)">
