      <stop offset="0.55" stop-color="#0f2a2a"/>
      <stop offset="1" stop-color="#1b1236"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
