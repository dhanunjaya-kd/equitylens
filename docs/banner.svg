    <path d="M76 76 L104 104" stroke="#2dd4bf" stroke-width="14" stroke-linecap="round"/>
    <path d="M28 58 L42 42 L52 52 L70 30" fill="none" stroke="#e6edf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="210" y="148" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="#e6edf3">Equity<tspan fill="url(#txt)">Lens</tspan></text>
  <text x="214" y="192" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" fill="#8b98a5">Fundamental + technical research for Indian stocks</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="214" y="216" width="128" height="34" rx="17" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e"/><text x="278" y="239" text-anchor="middle" fill="#22c55e">Scores</text>
    <rect x="352" y="216" width="128" height="34" rx="17" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8"/><text x="416" y="239" text-anchor="middle" fill="#38bdf8">3·5·10 yrs</text>
    <rect x="490" y="216" width="128" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b"/><text x="554" y="239" text-anchor="middle" fill="#f59e0b">Forensics</text>
    <rect x="628" y="216" width="104" height="34" rx="17" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa"/><text x="680" y="239" text-anchor="middle" fill="#a78bfa">Charts</text>
